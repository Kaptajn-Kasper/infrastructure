name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck bootstrap.sh bin/*

      - name: cloud-init schema
        run: |
          sudo apt-get install -y -qq cloud-init
          sudo cloud-init schema --config-file cloud-init.yaml

      - name: compose config
        run: |
          docker network create edge
          docker compose -f caddy/compose.yml config -q
          for f in apps/*/compose.yml; do
            IMAGE=example ENV=dev docker compose -f "$f" config -q
          done

      - name: caddy validate
        run: |
          mkdir -p extra
          bin/render-caddy-sites . extra/sites
          printf '(nonprod_auth) {\n\tbasic_auth {\n\t\tpreview %s\n\t}\n}\n' \
            "$(docker run --rm caddy:2-alpine caddy hash-password --plaintext ci)" > extra/auth.caddy
          docker run --rm -v "$PWD/caddy:/etc/caddy:ro" -v "$PWD/extra:/etc/caddy-extra:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
