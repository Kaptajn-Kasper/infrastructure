# Shared Keycloak (one instance, one realm per app environment) and its database.
# Managed by bin/infra-apply as compose project "keycloak". Secrets live in
# /etc/infra/keycloak.env, generated by setup.sh on first run.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: ["start", "--import-realm"]
    restart: unless-stopped
    env_file: /etc/infra/keycloak.env
    environment:
      KC_HOSTNAME: https://auth.kaptajnkasper.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
    volumes:
      # Realm definitions; imported only when a realm does not exist yet.
      - /srv/infra/services/keycloak/realms:/opt/keycloak/data/import:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 500
    healthcheck:
      # The image has no curl; query the management port with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        aliases: [keycloak]
      internal:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: /etc/infra/keycloak.env
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    volumes:
      - db:/var/lib/postgresql/data
    cap_drop: [ALL]
    # Needed by the entrypoint to fix data dir ownership and drop to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  db:

networks:
  edge:
    external: true
  internal:
    internal: true
