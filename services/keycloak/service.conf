# Shared Keycloak, served at https://auth.kaptajnkasper.net.
# Read by bin/render-caddy-sites (plain KEY=value, not sourced).

HOST=auth
DOMAIN=kaptajnkasper.net

# Container alias and port on the "edge" network
UPSTREAM=keycloak
PORT=8080

# Only reachable from the IPs in /etc/infra/admin-ips (403 for everyone else)
ADMIN_PATHS=/admin /admin/* /realms/master /realms/master/*
