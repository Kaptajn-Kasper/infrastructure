#cloud-config
# Optional: for a brand-new Hetzner server, paste this into "Cloud config" and
# select your SSH key at creation. It runs bootstrap.sh, which copies root's SSH
# key to the admin user. On a rebuilt server (no cloud config), run the same two
# commands by hand as root. See README.md.
packages:
  - git
runcmd:
  - git clone https://github.com/Kaptajn-Kasper/infrastructure.git /srv/infra
  - /srv/infra/bootstrap.sh
