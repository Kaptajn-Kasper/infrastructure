# Deployment settings for map-guesser-game. Read by bin/deploy and
# bin/render-caddy-sites (plain KEY=value, not sourced).

# GHCR repository; deploy only accepts <IMAGE>@sha256:<digest>
IMAGE=ghcr.io/kaptajn-kasper/map-guesser-game

# prod: map-guesser.kaptajnkasper.net, others: map-guesser-<env>.kaptajnkasper.net
HOST=map-guesser
DOMAIN=kaptajnkasper.net

# Port the container listens on (on the internal "edge" network)
PORT=8080

ENVS=dev preprod prod
